# CI: the checks of dev.monorithm:ui on each pull request and each push to main.
#   wrapper   the Gradle wrapper is the official one
#   check     the IR of the language matches its manifest, and the drift check of the generated tokens
#   analyze   Android lint. The Kotlin compilation of each platform also stops on each warning
#   test      the tests of each target
#   build     the library for Android, iOS, and the desktop
# The job runs on macOS, because Xcode is necessary for the iOS targets.
# Each action has a full commit SHA and a comment with its version.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Analyze, test, and build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository and the language
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check the language and the generated tokens
        run: ./gradlew checkLanguage

      - name: Analyze
        run: ./gradlew lint

      - name: Test
        run: ./gradlew allTests

      - name: Build
        run: ./gradlew assemble
